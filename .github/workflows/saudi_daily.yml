name: saudi-daily

on:
  schedule:
    - cron: "5 0 * * *"      # 00:05 UTC = just after API-Football's daily quota reset (4:05 PM Pacific)
  workflow_dispatch:

concurrency: saudi-daily

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt boto3 && pip install -e .
      - name: Download up to 90 Saudi matches (resumes where the last run stopped)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SHOTCAST_ROOT: s3://${{ vars.S3_BUCKET }}/pitchline
        run: python -m shotcast.saudi
