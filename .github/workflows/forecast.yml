name: forecast

# After the nightly download finishes: fit the model, run the backtest, save the new forecasts to S3.
# The site workflow starts when this one finishes. Manual backfills do not trigger it.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["espn-backfill"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt boto3 && pip install -e .
      - name: Train, backtest and save forecasts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SHOTCAST_ROOT: s3://${{ vars.S3_BUCKET }}/pitchline
        run: python -m shotcast.forecast
