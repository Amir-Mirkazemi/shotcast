name: leaderboard

on:
  workflow_dispatch:
    inputs:
      league:
        description: "ESPN league slug (leave empty for every stored league)"
        required: false
      top:
        description: "How many players per league (default 10)"
        required: false
        default: "10"
      player:
        description: "Look up one player by name instead, e.g. Haaland (leave empty for the leaderboards)"
        required: false

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt boto3 && pip install -e .
      - name: Top players per league (tables appear on the run summary page)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SHOTCAST_ROOT: s3://${{ vars.S3_BUCKET }}/pitchline
          IN_LEAGUE: ${{ github.event.inputs.league }}
          IN_TOP: ${{ github.event.inputs.top }}
          IN_PLAYER: ${{ github.event.inputs.player }}
        run: |
          ARGS="--top ${IN_TOP:-10}"
          [ -n "$IN_LEAGUE" ] && ARGS="$ARGS --league $IN_LEAGUE"
          if [ -n "$IN_PLAYER" ]; then
            python -m shotcast.leaderboard $ARGS --player "$IN_PLAYER"
          else
            python -m shotcast.leaderboard $ARGS
          fi
