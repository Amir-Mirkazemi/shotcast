[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchline"
version = "0.1.0"
description = "Soccer event-data pipeline: S3-ready ingest, Parquet bronze layer, dbt + DuckDB warehouse, Streamlit app."
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "pyarrow>=15", "pyyaml>=6", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/pitchline/site.py" = ["E501"]   # embedded CSS / JS / HTML strings
