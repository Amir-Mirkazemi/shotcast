name: shotcast
version: "0.1.0"
config-version: 2
profile: shotcast

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  shotcast:
    staging:
      # Tables, not views, so the .duckdb file is self-contained (no dependency on Parquet paths).
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    espn:
      +materialized: table
      +tags: [espn]

flags:
  send_anonymous_usage_stats: false
