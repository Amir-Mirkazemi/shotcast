version: 2

sources:
  - name: bronze
    description: Flattened StatsBomb open data written by `shotcast bronze` (Parquet).
    meta:
      external_location: "read_parquet('{{ env_var('SHOTCAST_BRONZE', '../data/bronze') }}/{name}/*.parquet', union_by_name=true)"
    tables:
      - name: matches
      - name: events
      - name: lineups
